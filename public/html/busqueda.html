<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/busqueda.css">
  <link rel="stylesheet" href="../css/userModal.css">
</head>

<body>

  <body>

  <!-- ── NAVBAR ── -->
  <nav class="headerContainer">
    <div class="nav-logo">
      <img src='../static/Logo trazabilidad.svg' alt="Logo">
    </div>

    <ul class="nav-links">
      <li><a href="/registro">Realizar registro</a></li>
      <li><a href="/busqueda" class="active">Ver registros</a></li>
      <li><a href="/editUsers">Editar usuarios</a></li>
      <li><a href="/editTelegram">Editar usuarios de Telegram</a></li>
    </ul>

    <div id="profileBtn" class="nav-profile">
      <!-- Profile / user icon -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#a8c0d6" stroke-width="1.8" fill="none" />
        <circle cx="20" cy="16" r="6" fill="#a8c0d6" />
        <path d="M8 34c0-6.627 5.373-10 12-10s12 3.373 12 10" fill="#a8c0d6" />
      </svg>
    </div>
  </nav>

  <!-- ── MAIN ── -->
  <main>

    <!-- Filter form -->
    <div class="formContainer">

      <button type="button" class="nav-arrow" id="btnNext" title="Anterior">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>

      <form class="filter-form">
        <select class="filter-select" id="filtroSelect" required></select>

        <div class="search-wrapper">
          <input type="number" id="busqueda" placeholder="Introduzca ID" required />
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </div>

        <button type="submit" class="btn-ejecutar">Ejecutar</button>
      </form>

      <button type="button" class="nav-arrow" id="btnPrev" title="Siguiente">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>

    </div>

    <!-- Results table -->
    <div>
      <h1 id="actualTable"></h1>
    </div>
    <div class="table-wrapper">
      <table id="resultsTable">

      </table>
    </div>
  </main>

  <!-- Modal de usuario -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <div class="modal-avatar">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="16" r="7" fill="#a8c0d6" />
          <path d="M6 38c0-7.732 6.268-12 14-12s14 4.268 14 12" fill="#a8c0d6" />
        </svg>
      </div>
      <span class="modal-name" id="modalName">Nombre de usuario</span>
      <span class="modal-email" id="modalEmail">usuario@correo.com</span>
      <div class="modal-divider"></div>
      <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </div>

  <script src="../JS/busqueda.js"></script>
  <script src="../JS/userModal.js" type="module"></script>
</body>

</html>
