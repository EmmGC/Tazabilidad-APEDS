<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Product.css">
    <title>Trazabilidad de Producto | Dashboard</title>
</head>

<body>
    <!-- header -->
    
    
    <main id="mainContent">
        <a href="#" id="readMoreBtn" class="read-more-btn">Leer más <span>&gt;</span></a>
        <div class="loadingScreen" id="loading">
            <span class="loader"></span>
        </div>

        <h1 id="titleContainer">Cargando Trazabilidad...</h1>
        
        <div id="tablasContainer">
            <section class="section-card">
                <h2>Cliente Final</h2>
                <div class="table-responsive">
                    <table id="clienteFinalTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Embarque</h2>
                <div class="table-responsive">
                    <table id="embarqueTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Transporte</h2>
                <div class="table-responsive">
                    <table id="transporteTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Lote de cosecha</h2>
                <div class="table-responsive">
                    <table id="lotCoseTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Sección de cultivo</h2>
                <div class="table-responsive">
                    <table id="seccionCultivoTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Unidad de producción</h2>
                <div class="table-responsive">
                    <table id="uniProductTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Bitácora de actividades</h2>
                <div class="table-responsive">
                    <table id="bitActTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Aplicación de insumos</h2>
                <div class="table-responsive">
                    <table id="insumosTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Información del proveedor</h2>
                <div class="table-responsive">
                    <table id="proveedorTable"></table>
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts js -->
    <script src="../JS/Product.js"></script>
</body>

</html>
