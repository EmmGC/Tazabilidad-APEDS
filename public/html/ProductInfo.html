<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/ProductInfo.css">
    <title>Información del Producto | Trazabilidad</title>
</head>

<body>
    <!-- header -->
    <div class="headerContainer">
        <img src="../static/Logo trazabilidad.svg" alt="Logo">
        <!-- <div class="headerLinkContainer">
             TODO: ver porque no quiere funcionar la clase currentPage
            <a class="currentPage" href="">Realizar registro</a>
            <a href="">Ver registros</a>
        </div> -->
    </div>
    <!-- fin header -->
    <div class="loadingScreen" id="loading">
        <span class="loader"></span>
    </div>

        <h1 id="titleContainer">Cargando Información...</h1>
        
        <div id="tablasContainer">
            <section class="section-card">
                <h2>Cliente Final</h2>
                <div class="table-responsive">
                    <table id="clienteTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Embarque</h2>
                <div class="table-responsive">
                    <table id="embarqueTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Transporte</h2>
                <div class="table-responsive">
                    <table id="transporteTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Lote de cosecha</h2>
                <div class="table-responsive">
                    <table id="lotCoseTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Sección de cultivo</h2>
                <div class="table-responsive">
                    <table id="seccionCultivoTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Unidad de producción</h2>
                <div class="table-responsive">
                    <table id="uniProductTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Bitácora de actividades</h2>
                <div class="table-responsive">
                    <table id="bitActTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Aplicación de insumos</h2>
                <div class="table-responsive">
                    <table id="detAplicInsumosTable"></table>
                </div>
            </section>

            <section class="section-card">
                <h2>Información del proveedor</h2>
                <div class="table-responsive">
                    <table id="recepInsumosTable"></table>
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts js -->
    <script src="../JS/ProductInfo.js"></script>
</body>

</html>
